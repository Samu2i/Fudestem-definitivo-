<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - FUNDESTEAM</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }
        .logo { font-size: 2.5rem; margin-bottom: 0.5rem; }
        h2 { color: #1e293b; margin-top: 0; margin-bottom: 0.5rem; }
        #nombreUsuario { color: #2563eb; font-weight: 600; margin-bottom: 1.5rem; font-size: 1.1rem; }
        #fechaActual { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
        button {
            width: 100%;
            padding: 0.85rem;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #15803d; }
        .logout-btn {
            background: transparent;
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        .logout-btn:hover { background: #fee2e2; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">🎓</div>
        <h2>FUNDESTEAM</h2>
        <div id="nombreUsuario">Cargando usuario...</div>
        <div id="fechaActual">Cargando fecha...</div>
        
        <button id="btnAsistencia">¡Confirmar mi Asistencia!</button>
        <button id="btnCerrarSesion" class="logout-btn">Cerrar Sesión</button>
    </div>

    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. Configuración de Supabase (las mismas credenciales)
        const SUPABASE_URL = "TU_PROJECT_URL_AQUI";
        const SUPABASE_KEY = "TU_ANON_PUBLIC_KEY_AQUI";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioActual = null;

        // 2. Al cargar la página, verificar sesión y mostrar fecha
        window.addEventListener("DOMContentLoaded", async () => {
            // Mostrar fecha actual formateada
            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("fechaActual").innerText = new Date().toLocaleDateString('es-ES', opciones);

            // Obtener el usuario logueado
            const { data: { user }, error } = await supabase.auth.getUser();

            if (error || !user) {
                // Si no hay sesión, regresar al login
                window.location.href = "index.html";
                return;
            }

            usuarioActual = user;

            // Buscar el nombre del usuario en la tabla 'usuarios'
            const { data: perfil, error: perfilError } = await supabase
                .from("usuarios")
                .select("nombre")
                .eq("id", user.id)
                .single();

            if (perfil) {
                document.getElementById("nombreUsuario").innerText = `Hola, ${perfil.nombre}`;
            } else {
                document.getElementById("nombreUsuario").innerText = user.email;
            }
        });

        // 3. Botón para registrar asistencia
        document.getElementById("btnAsistencia").addEventListener("click", async () => {
            if (!usuarioActual) return;

            const btn = document.getElementById("btnAsistencia");
            btn.disabled = true;
            btn.innerText = "Registrando...";

            // Insertar en la tabla asistencias
            const { error } = await supabase
                .from("asistencias")
                .insert([{ usuario_id: usuarioActual.id }]);

            if (error) {
                if (error.code === '23505') { // Código de duplicado si agregaste restricción única
                    alert("Ya habías registrado tu asistencia el día de hoy.");
                } else {
                    alert("Error al registrar: " + error.message);
                }
                btn.disabled = false;
                btn.innerText = "¡Confirmar mi Asistencia!";
            } else {
                alert("¡Asistencia confirmada con éxito!");
                btn.innerText = "¡Asistencia Registrada!";
                btn.style.background = "#94a3b8";
            }
        });

        // 4. Botón de Cerrar Sesión
        document.getElementById("btnCerrarSesion").addEventListener("click", async () => {
            await supabase.auth.signOut();
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
