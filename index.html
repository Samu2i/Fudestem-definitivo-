<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Asistencia - Fundesteam</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attendance-card {
            background: white;
            padding: 40px 35px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            border-top: 6px solid #0095D3;
            text-align: center;
        }

        .brand-logo {
            color: #0095D3;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #595A5C;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2b2b2c;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0095D3;
            box-shadow: 0 0 0 3px rgba(0, 149, 211, 0.15);
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            background-color: #0095D3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-confirm:hover {
            background-color: #007BB0;
        }

        .btn-confirm:active {
            transform: scale(0.99);
        }

        .btn-confirm:disabled {
            background-color: #95cde6;
            cursor: not-allowed;
        }

        /* Mensaje de éxito visual */
        .success-box {
            display: none;
            background-color: #e6f7ed;
            border: 1px solid #28a745;
            color: #1e7e34;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 14px;
        }

        .success-box strong {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .date-badge {
            display: inline-block;
            background-color: #eef5f9;
            color: #0095D3;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="attendance-card">
        <div class="brand-logo">🎓 FUNDESTEAM</div>
        <div class="subtitle">Control de Asistencia Rápida</div>
        
        <div class="date-badge" id="fechaHoy">Cargando fecha...</div>

        <form id="asistenciaForm">
            <div class="form-group">
                <label for="nombreCompleto">Nombre Completo</label>
                <input type="text" id="nombreCompleto" placeholder="Escribe tu nombre y apellido" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="curso">Curso / Taller (Opcional)</label>
                <select id="curso">
                    <option value="General">Asistencia General</option>
                    <option value="Robótica Educativa con Arduino">Robótica Educativa con Arduino</option>
                    <option value="Fundamentos de Python">Fundamentos de Python</option>
                </select>
            </div>

            <button type="submit" id="btnGuardar" class="btn-confirm">✓ Confirmar Asistencia</button>
        </form>

        <div id="mensajeExito" class="success-box">
            <strong>¡Asistencia Confirmada!</strong>
            <span id="detalleConfirmacion"></span>
        </div>
    </div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. REEMPLAZA CON TUS CREDENCIALES REALES DE SUPABASE
        const SUPABASE_URL = 'TU_URL_DE_SUPABASE';
        const SUPABASE_ANON_KEY = 'TU_CLAVE_ANON_PUBLICA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Mostrar la fecha actual en pantalla
        const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const hoy = new Date().toLocaleDateString('es-PA', opcionesFecha);
        document.getElementById('fechaHoy').textContent = hoy.charAt(0).toUpperCase() + hoy.slice(1);

        // 2. Manejar el envío del formulario
        document.getElementById('asistenciaForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const btn = document.getElementById('btnGuardar');
            const nombre = document.getElementById('nombreCompleto').value.trim();
            const curso = document.getElementById('curso').value;
            const mensajeExito = document.getElementById('mensajeExito');
            const detalleConfirmacion = document.getElementById('detalleConfirmacion');

            if (!nombre) return;

            btn.disabled = true;
            btn.textContent = "Registrando...";
            mensajeExito.style.display = "none";

            // Guardar en la tabla 'asistencias' de Supabase
            const { data, error } = await supabaseClient
                .from('asistencias')
                .insert([{ 
                    nombre: nombre, 
                    curso: curso 
                }]);

            btn.disabled = false;
            btn.textContent = "✓ Confirmar Asistencia";

            if (error) {
                alert("Hubo un error al registrar la asistencia: " + error.message);
            } else {
                const horaActual = new Date().toLocaleTimeString('es-PA', { hour: '2-digit', minute: '2-digit' });
                detalleConfirmacion.textContent = `${nombre} registrado(a) a las ${horaActual} en ${curso}.`;
                mensajeExito.style.display = "block";
                
                // Limpiar el campo de nombre para que la siguiente persona pueda registrarse
                document.getElementById('nombreCompleto').value = "";
            }
        });
    </script>
</body>
</html>
